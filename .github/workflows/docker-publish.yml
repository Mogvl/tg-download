name: Docker Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # GHCR 镜像路径必须全小写
  IMAGE: ghcr.io/mogvl/tg-download

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 关键：GITHUB_TOKEN 默认无写包权限

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # 绿联 NAS x86；如需 arm64 在此追加
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 失败时把错误摘要写进 check 注解（匿名可读，无需 admin 权限拉日志）
      - name: Surface build error as annotation
        if: failure()
        run: |
          ERR=$(docker buildx build --platform linux/amd64 --progress=plain . 2>&1 \
            | grep -Ei "ERROR|denied|not found" | tail -n 3 | tr '\n' ' ' | head -c 700)
          echo "::error title=Docker build error::${ERR:-see-run-logs}"
