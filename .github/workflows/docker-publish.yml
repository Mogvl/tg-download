name: Docker Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # GHCR 镜像路径必须全小写
  IMAGE: ghcr.io/mogvl/tg-download

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 关键：GITHUB_TOKEN 默认无写包权限

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # 绿联 NAS 多为 x86_64；同时支持 arm64（部分 ARM NAS/树莓派）
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 失败时提示查看 run 日志（避免重新 build 一次浪费额度）
      - name: Surface build failure
        if: failure()
        run: echo "::error title=Docker build failed::查看上方步骤日志定位错误"
