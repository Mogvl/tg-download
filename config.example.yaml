# ============================================================
# Telegram Media Downloader 配置文件模板
# 使用方法：复制本文件为 config.yaml，并至少填写 api_id / api_hash / chat
#   cp config.example.yaml config.yaml
# 完整配置说明见项目 README.md
# ============================================================

# ---- 必填：Telegram API 凭证（https://my.telegram.org/apps 获取）----
api_id:         # 例如 1234567
api_hash:                             # 例如 0123456789abcdef0123456789abcdef

# 可选：Bot Token（用于机器人交互下载；不用机器人则留空）
bot_token: ''

# ---- 必填：要下载的聊天/频道列表 ----
chat:
- chat_id: 
  last_read_message_id: 0
  note: ''
media_types:
- photo
- video
- animation
file_formats:
  audio:
  - all
  video:
  - all
  document:
  - all
  photo:
  - all
save_path: /app/downloads

# 子目录结构，可组合：chat_title / media_datetime / media_type
file_path_prefix:
- chat_title
- media_datetime

# 文件命名前缀，可组合：message_id / file_name / caption
file_name_prefix:
- publish_time
- file_name
file_name_prefix_split: ' - '

# ---- Web 管理界面 ----
web_host: 0.0.0.0         # Docker 部署必须为 0.0.0.0
web_port: 5000            # 对外端口由 docker-compose.yml 的端口映射决定（默认 13087）
# Web UI 登录开关：true=必须输入密码登录；false/留空=免登录直接进主页
# 注意：开关开启后必须同时设置 web_login_secret，否则任何密码都会被拒绝
web_login_enabled: false
# Web UI 登录密码（仅在 web_login_enabled: true 时生效）
web_login_secret: 
hide_file_name: false

language: ZH               # 界面语言：EN / ZH / RU / UA

# 最大并发下载任务数（同时下载的文件数）
max_download_task: 5

# 单文件并行分块下载连接数（1 = 关闭，走 pyrogram 默认顺序下载）
# Telegram 单连接吞吐有限（跨区 DC 单文件常见 ~1.5-2MB/s），开启后
# 大文件(>=20MB)用多条连接并发拉取不同分块，可显著提升单文件速度。
# 建议 3~6；过大可能触发服务端限流（会自动回退顺序下载，不会导致下载失败）
concurrent_chunks_per_file: 1

# 启动容器后是否自动开始下载；false=需在 Web 界面手动点「开始下载」
auto_download: false

# 日期目录格式
date_format: '%Y_%m'

# 是否下载 txt 文件
enable_download_txt: false

# 允许使用机器人的用户 ID（不配置则仅允许当前登录账号）
# allowed_user_ids:
#   - 'username'

# ---- 云盘上传（可选）----
upload_drive:
  enable_upload_file: false
  # remote_dir: drive:/telegram
  # upload_adapter: rclone       # rclone 或 aligo
  # rclone_path: /app/rclone/rclone
  # before_upload_file_zip: false
  # after_upload_file_delete: false

# ---- 代理（可选，按需取消注释）----
# proxy:
#   scheme: socks5             # socks4 / socks5 / http
#   hostname: 192.168.1.1
#   port: 7890
#   username: ""               # 无认证则删除这两行
#   password: ""
filter_advertisement_list: []
replace_advertisement_list: []
group_add_advertisement: {}
restart_program: false