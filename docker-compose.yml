version: '3.8'

services:
  tg-download:
    image: tangyoha/telegram_media_downloader:latest
    container_name: tg-download
    ports:
      - "13087:5000"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./downloads:/app/downloads
      - ./sessions:/app/sessions
    restart: unless-stopped
