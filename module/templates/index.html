<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5fb">
  <title>Telegram Media Downloader</title>
  <link href="static/layui/css/layui.css" rel="stylesheet">
  <link href="static/css/index.css" rel="stylesheet">
  <style>
    body { padding: 32px 24px 120px; }
    /* ── 标签页切换 ── */
    .tg-glass > section { display:none; }
    .tg-glass > section.on { display:block; }
    .nav { display:flex; gap:6px; margin-bottom:28px; border-bottom:1px solid var(--hairline); padding-bottom:12px; }
    .nav-btn {
      padding:9px 22px; border:none; border-radius:999px; cursor:pointer;
      font-size:13px; font-weight:500; letter-spacing:.06em;
      color:var(--ink-3); background:transparent; transition:all .25s var(--ease);
    }
    .nav-btn:hover { color:var(--ink); background:rgba(255,255,255,.4); }
    .nav-btn.on { color:#fff; background:var(--grad); box-shadow:0 4px 14px rgba(178,138,222,.22); }
    /* ── 通用表单 ── */
    .f-section { margin-bottom:28px; }
    .f-label { display:block; font-size:11px; font-weight:600; letter-spacing:.1em; color:var(--ink-3); text-transform:uppercase; margin-bottom:12px; }
    .f-row { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
    .f-field { flex:1; min-width:140px; }
    .f-field label { display:block; font-size:12px; font-weight:500; color:var(--ink-2); margin-bottom:4px; }
    .f-field input, .f-field select, .f-field textarea {
      width:100%; box-sizing:border-box; height:38px; padding:0 12px;
      border:1px solid var(--hairline); border-radius:10px;
      background:rgba(255,255,255,.55); color:var(--ink); font-size:13px; outline:none;
      transition:border-color .2s, box-shadow .2s;
    }
    .f-field textarea { height:auto; padding:8px 12px; line-height:1.6; resize:vertical; min-height:36px; }
    .f-field input:focus, .f-field select:focus, .f-field textarea:focus {
      border-color:var(--mist-violet); box-shadow:0 0 0 3px rgba(203,180,236,.15);
    }
    /* chips */
    .chips { display:flex; flex-wrap:wrap; gap:8px; }
    .chips label {
      display:inline-flex; align-items:center; gap:5px; padding:5px 14px;
      border-radius:999px; font-size:12.5px; border:1px solid var(--hairline);
      background:rgba(255,255,255,.45); color:var(--ink-2); cursor:pointer; transition:all .2s;
    }
    .chips label:has(input:checked) { border-color:var(--mist-violet); background:rgba(203,180,236,.12); color:var(--ink); }
    .chips input { display:none; }
    /* chat card */
    .cc { display:flex; flex-wrap:nowrap; align-items:center; gap:8px; padding:8px 12px; margin-bottom:6px; border-radius:10px; background:rgba(255,255,255,.35); border:1px solid var(--hairline); }
    .cc input { flex:1; height:32px; border:1px solid var(--hairline); border-radius:8px; padding:0 10px; font-size:12.5px; background:rgba(255,255,255,.5); color:var(--ink); outline:none; }
    .cc input:focus { border-color:var(--mist-violet); }
    .cc .cid { flex:0 1 200px; min-width:150px; }
    .cc .clr { flex:0 0 160px; min-width:160px; }
    .cc .cnote { flex:1 1 80px; min-width:60px; }
    .cc .x { width:26px; height:26px; border:none; border-radius:7px; cursor:pointer; background:rgba(239,68,68,.06); color:#d4748a; font-size:13px; display:flex; align-items:center; justify-content:center; }
    .cc .x:hover { background:rgba(239,68,68,.12); }
    .cc .mv { width:26px; height:26px; border:none; border-radius:7px; cursor:pointer; background:rgba(178,138,222,.08); color:#9b7bc8; font-size:13px; display:flex; align-items:center; justify-content:center; }
    .cc .mv:hover { background:rgba(178,138,222,.18); }
    /* toggle switch */
    .switch { position:relative; display:inline-block; width:46px; height:26px; margin-top:6px; }
    .switch input { opacity:0; width:0; height:0; }
    .switch .slider { position:absolute; cursor:pointer; inset:0; background:rgba(0,0,0,.12); border-radius:999px; transition:.25s; }
    .switch .slider:before { content:""; position:absolute; height:20px; width:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.25s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
    .switch input:checked + .slider { background:var(--mist-violet); }
    .switch input:checked + .slider:before { transform:translateX(20px); }
    /* btns */
    .bar { display:flex; justify-content:flex-end; gap:10px; padding-top:16px; border-top:1px solid var(--hairline); margin-top:8px; }
    .bar button { padding:9px 24px; border-radius:999px; border:none; cursor:pointer; font-size:13px; font-weight:500; letter-spacing:.06em; transition:all .25s var(--ease); }
    .bg { background:var(--grad); color:#fff; box-shadow:0 6px 20px rgba(178,138,222,.22); }
    .bg:hover { transform:translateY(-1px); }
    .bg:active { transform:scale(.97); }
    .bh { background:rgba(255,255,255,.45); color:var(--ink-2); border:1px solid var(--hairline); }
    /* toast */
    #toast { position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-50px); padding:10px 24px; border-radius:10px; font-size:13px; background:rgba(255,255,255,.88); border:1px solid var(--mist-violet); box-shadow:var(--shadow-float); color:var(--ink); z-index:999; backdrop-filter:blur(12px); opacity:0; transition:all .3s var(--ease); pointer-events:none; }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    /* ── 日志 ── */
    .log-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .log-bar span { font-size:12px; color:var(--ink-3); }
    .log-toggle { padding:5px 14px; border-radius:999px; border:1px solid var(--hairline); background:rgba(255,255,255,.45); color:var(--ink-2); cursor:pointer; font-size:12px; transition:all .2s; }
    .log-toggle.on { background:var(--grad); color:#fff; border-color:transparent; }
    .log-box {
      background:rgba(30,25,40,.88); color:#d4cce6; border-radius:14px;
      padding:18px 22px; font-family:"SF Mono","JetBrains Mono","Cascadia Code",monospace;
      font-size:12px; line-height:1.75; overflow-y:auto; height:480px;
      border:1px solid rgba(255,255,255,.06);
    }
    .log-box::-webkit-scrollbar { width:5px; }
    .log-box::-webkit-scrollbar-thumb { background:rgba(203,180,236,.3); border-radius:3px; }
    /* 日志列表 */
    .log-list { width:100%; max-height:480px; overflow-y:auto; border-collapse:collapse; border-radius:14px; border:1px solid rgba(122,96,158,.08); background:rgba(255,255,255,.3); font-size:12.5px; }
    .log-list thead th { position:sticky; top:0; background:rgba(236,230,244,.95); color:#3d3547; font-size:11px; font-weight:600; letter-spacing:.08em; text-align:left; padding:10px 14px; border-bottom:1px solid rgba(122,96,158,.12); white-space:nowrap; }
    .log-list tbody td { padding:8px 14px; border-bottom:1px solid rgba(122,96,158,.05); color:#2b2531; vertical-align:middle; }
    .log-list tbody tr:last-child td { border-bottom:none; }
    .log-list tbody tr:hover { background:rgba(203,180,236,.06); }
    .log-list td.log-fname { word-break:break-all; }
    .st-ok { color:#3f8f5f; font-weight:600; }
    .st-fail { color:#b04343; font-weight:600; }
    .st-skip { color:#7d748a; font-weight:600; }
    .log-fname { word-break:break-all; }
    .log-list::-webkit-scrollbar { width:5px; }
    .log-list::-webkit-scrollbar-thumb { background:rgba(203,180,236,.3); border-radius:3px; }
    /* 进度条 */
    .pbar-wrap { display:flex; align-items:center; gap:6px; width:100%; }
    .pbar { flex:1; height:8px; border-radius:999px; background:rgba(122,96,158,.14); overflow:hidden; position:relative; }
    .pbar-fill { height:100%; border-radius:999px; transition:width .5s var(--ease); position:relative; }
    .pbar-fill::after { content:""; position:absolute; top:0; left:0; right:0; height:45%;
      border-radius:999px 999px 0 0; background:linear-gradient(180deg,rgba(255,255,255,.35),transparent); }
    .pbar-violet { background:linear-gradient(90deg,#a78bfa,#8b5cf6); box-shadow:0 1px 6px rgba(139,92,246,.35); }
    .pbar-pink   { background:linear-gradient(90deg,#f472b6,#ec4899); box-shadow:0 1px 6px rgba(236,72,153,.30); }
    .pbar-green  { background:linear-gradient(90deg,#34d399,#10b981); box-shadow:0 1px 6px rgba(16,185,129,.28); }
    .pbar-pct { font-size:11px; font-weight:600; color:var(--ink); min-width:36px; text-align:right;
      font-variant-numeric:tabular-nums; }
    /* ── 速度胶囊（左上角） ── */
    .speed-pill {
      display:inline-flex; align-items:center; gap:6px; margin-left:12px;
      padding:4px 14px; border-radius:999px;
      background:var(--grad); color:#fff; font-size:12px; font-weight:600;
      font-variant-numeric:tabular-nums; letter-spacing:.03em;
      box-shadow:0 4px 14px rgba(178,138,222,.28);
    }
    .speed-pill .speed-arrow { font-size:13px; animation:speed-pulse 1.6s ease-in-out infinite; }
    @keyframes speed-pulse { 0%,100%{opacity:1;} 50%{opacity:.45;} }
    /* ── 统计概览条 ── */
    .dl-stats {
      display:grid; grid-template-columns:repeat(4,1fr); gap:12px;
      margin-bottom:20px;
    }
    .stat-cell {
      background:rgba(255,255,255,.42); border:1px solid rgba(255,255,255,.6);
      border-radius:14px; padding:14px 16px; text-align:center;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 2px 10px rgba(146,112,190,.05);
    }
    .stat-num { display:block; font-size:22px; font-weight:700; color:var(--ink);
      font-variant-numeric:tabular-nums; line-height:1.2; }
    .stat-lbl { display:block; margin-top:4px; font-size:11px; font-weight:500;
      letter-spacing:.1em; color:var(--ink-3); text-transform:uppercase; }
    #st-failed { color:#d4748a; }
    #st-finished { color:#6db88a; }
    /* ── 实时表格：类型图标 + 文件名 + 状态徽章 ── */
    .ftype {
      display:inline-flex; align-items:center; justify-content:center;
      width:24px; height:24px; border-radius:7px; margin-right:8px;
      font-size:12px; color:#fff; vertical-align:middle; flex:none;
    }
    .ftype-video   { background:linear-gradient(135deg,#a78bfa,#8b5cf6); }
    .ftype-audio   { background:linear-gradient(135deg,#f472b6,#ec4899); }
    .ftype-photo   { background:linear-gradient(135deg,#fbbf24,#f59e0b); }
    .ftype-document{ background:linear-gradient(135deg,#60a5fa,#3b82f6); }
    .ftype-voice   { background:linear-gradient(135deg,#34d399,#10b981); }
    .ftype-animation{ background:linear-gradient(135deg,#f472b6,#a78bfa); }
    .ftype-unknown { background:rgba(146,112,190,.35); }
    .fname { vertical-align:middle; word-break:break-all; }
    .st-badge {
      display:inline-flex; align-items:center; gap:6px;
      padding:4px 12px; border-radius:999px;
      font-size:11px; font-weight:600; letter-spacing:.04em; white-space:nowrap;
      vertical-align:middle;
    }
    .st-badge::before {
      content:""; width:6px; height:6px; border-radius:50%; flex:none;
    }
    .st-run  { background:linear-gradient(135deg,#a78bfa,#8b5cf6); color:#fff; box-shadow:0 2px 8px rgba(139,92,246,.30); }
    .st-run::before  { background:#fff; animation:st-pulse 1.1s ease-in-out infinite; }
    .st-wait { background:rgba(146,112,190,.10); color:#8d8498; }
    .st-wait::before { background:#b9b2c6; }
    .st-done { background:linear-gradient(135deg,#34d399,#10b981); color:#fff; box-shadow:0 2px 8px rgba(16,185,129,.28); }
    .st-done::before { background:#fff; }
    @keyframes st-pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%     { opacity:.35; transform:scale(.72); }
    }
    /* ── 历史 ── */
    .hs { display:flex; gap:10px; margin-bottom:18px; }
    .hs input { flex:1; height:38px; padding:0 12px; border:1px solid var(--hairline); border-radius:10px; background:rgba(255,255,255,.55); font-size:13px; color:var(--ink); outline:none; }
    .hs input:focus { border-color:var(--mist-violet); }
    .hs button { padding:8px 20px; border-radius:999px; border:none; background:var(--grad); color:#fff; font-size:12px; cursor:pointer; }
    .ht { width:100%; border-collapse:collapse; }
    .ht th { text-align:left; font-size:11px; font-weight:600; letter-spacing:.1em; color:#3d3547; padding:7px 10px; border-bottom:1px solid var(--hairline); }
    .ht td { padding:9px 10px; font-size:13px; color:#2b2531; border-bottom:1px solid rgba(122,96,158,.06); font-variant-numeric:tabular-nums; }
    .ht tr:hover td { background:rgba(203,180,236,.05); }
    .hp { display:flex; justify-content:center; align-items:center; gap:14px; margin-top:18px; }
    .hp button { width:30px; height:30px; border-radius:7px; border:1px solid var(--hairline); background:rgba(255,255,255,.45); color:var(--ink-2); cursor:pointer; font-size:13px; }
    .hp button:disabled { opacity:.3; cursor:default; }
    .hp span { font-size:12px; color:var(--ink-3); }
    .empty { text-align:center; color:var(--ink-3); padding:48px 0; font-size:13px; }
  </style>
</head>
<body>

<div id="toast"></div>

<div class="tg-glass" style="max-width:1060px; margin:0 auto;">
  <!-- 版本 + 实时速度（左上角） -->
  <div class="dl-speed-top">
    <span style="color:var(--mist-violet);font-weight:600">v<span id="app_version">—</span></span>
    <span class="speed-pill" id="speed-pill"><span class="speed-arrow">↓</span><span id="download_speed_title">0.00 B/s</span></span>
  </div>
  <!-- 导航 -->
  <div class="nav">
    <button class="nav-btn on" onclick="showTab('config',this)">配置</button>
    <button class="nav-btn" onclick="showTab('downloads',this)">下载</button>
    <button class="nav-btn" onclick="showTab('logs',this)">日志</button>
    <button class="nav-btn" onclick="showTab('history',this)">历史</button>
  </div>

  <!-- ═══════ 1. 配置 ═══════ -->
  <section class="on" id="p-config">
    <div class="f-section">
      <div class="f-label">API 凭证</div>
      <div class="f-row">
        <div class="f-field" style="max-width:180px"><label>API ID</label><input id="c-apid" type="number"></div>
        <div class="f-field"><label>API Hash</label><input id="c-apih" type="text" placeholder="已设置（修改时填入新值）"></div>
        <div class="f-field"><label>Bot Token（可选）</label><input id="c-bot" type="text" placeholder="留空 = 不使用机器人"></div>
      </div>
    </div>
    <div class="f-section">
      <div class="f-label">媒体类型</div>
      <div class="chips" id="c-media">
        <label><input type="checkbox" value="audio"> 音频</label>
        <label><input type="checkbox" value="document"> 文档</label>
        <label><input type="checkbox" value="photo"> 照片</label>
        <label><input type="checkbox" value="video"> 视频</label>
        <label><input type="checkbox" value="voice"> 语音</label>
        <label><input type="checkbox" value="animation"> 动图</label>
      </div>
    </div>
    <div class="f-section">
      <div class="f-label">文件格式（逗号分隔，all = 全部）</div>
      <div class="f-row">
        <div class="f-field"><label>音频</label><input id="c-fa" value="all"></div>
        <div class="f-field"><label>视频</label><input id="c-fv" value="all"></div>
        <div class="f-field"><label>文档</label><input id="c-fd" value="all"></div>
        <div class="f-field"><label>照片</label><input id="c-fp" value="all"></div>
      </div>
    </div>
    <div class="f-section">
      <div class="f-label">下载目标（频道 / 群组 / 收藏夹）</div>
      <div id="c-chats"></div>
      <button class="bh" style="margin-top:8px;padding:6px 16px;font-size:12px" onclick="addChat()">+ 添加</button>
    </div>
    <div class="f-section">
      <div class="f-label">基本设置</div>
      <div class="f-row">
        <div class="f-field" style="max-width:140px"><label>最大并发</label><input id="c-mt" type="number" value="5"></div>
        <div class="f-field" style="max-width:140px"><label>语言</label><select id="c-lang"><option value="EN">English</option><option value="ZH">中文</option></select></div>
        <div class="f-field" style="max-width:140px"><label>日期格式</label><input id="c-df" value="%Y_%m"></div>
        <div class="f-field" style="flex:0 0 auto"><label>登录开关</label>
          <label class="switch"><input type="checkbox" id="c-wle"><span class="slider"></span></label>
          <small style="display:block;color:var(--ink-3);margin-top:4px">开=需密码登录，关=免登录直进</small>
        </div>
        <div class="f-field"><label>登录密码（Web UI）</label><input id="c-ws" type="text" placeholder="开启开关后必填"></div>
      </div>
    </div>
    <div class="bar">
      <button class="bh" onclick="loadCfg()">重新加载</button>
      <button class="bh" onclick="saveCfg()" style="border-color:var(--mist-violet)">仅保存</button>
      <button class="bg" onclick="saveCfg(true)">保存并重启</button>
    </div>
  </section>

  <!-- ═══════ 2. 下载 ═══════ -->
  <section id="p-downloads">
    <!-- 统计概览条 -->
    <div class="dl-stats">
      <div class="stat-cell">
        <span class="stat-num" id="st-active">0</span>
        <span class="stat-lbl">进行中</span>
      </div>
      <div class="stat-cell">
        <span class="stat-num" id="st-finished">0</span>
        <span class="stat-lbl">已完成</span>
      </div>
      <div class="stat-cell">
        <span class="stat-num" id="st-failed">0</span>
        <span class="stat-lbl">失败</span>
      </div>
      <div class="stat-cell">
        <span class="stat-num" id="st-total">0</span>
        <span class="stat-lbl">总任务</span>
      </div>
    </div>
    <!-- 实时下载 -->
    <div class="dl-card">
      <div class="dl-head">
        <div class="dl-title">
          <span class="dl-icon">↓</span>
          <span>实时下载</span>
          <span class="dl-badge" id="dl-done-badge" style="display:none">✓ 全部完成</span>
        </div>
        <div style="display:flex;align-items:center;gap:14px">
          <button class="stop-btn" id="download_state" data-value="{{ download_state }}"
            onclick="dlToggle(this)">{{ {'pause':'暂停','continue':'继续'}[download_state] }}</button>
        </div>
      </div>
      <div id="dl-active-wrap">
        <table class="layui-hide" id="download_list" lay-filter="download_list"></table>
        <div class="dl-empty" id="dl-empty-active">
          <div class="dl-empty-icon">✦</div>
          <div>暂无进行中的任务</div>
        </div>
      </div>
    </div>

    <!-- 已下载 -->
    <div class="dl-card" style="margin-top:20px">
      <div class="dl-head">
        <div class="dl-title">
          <span class="dl-icon dl-icon-ok">✓</span>
          <span>已下载</span>
        </div>
      </div>
      <div id="dl-done-wrap">
        <table class="layui-hide" id="already_download_list" lay-filter="already_download_list"></table>
        <div class="dl-empty" id="dl-empty-done">
          <div class="dl-empty-icon">◇</div>
          <div>暂无已下载文件</div>
        </div>
        <!-- 翻页 -->
        <div class="dl-page" id="dl-done-page">
          <div class="dl-page-size">
            每页
            <select id="dl-done-pps" onchange="dlDoneGo(1)">
              <option value="5">5</option>
              <option value="10" selected>10</option>
              <option value="20">20</option>
              <option value="50">50</option>
            </select>
            条
          </div>
          <div class="dl-page-nav">
            <button onclick="dlDoneGo(-1)" id="dl-done-prev">‹</button>
            <span id="dl-done-info">1 / 1</span>
            <button onclick="dlDoneGo(1)" id="dl-done-next">›</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ═══════ 3. 日志 ═══════ -->
  <section id="p-logs">
    <div class="log-bar">
      <span id="log-n">加载中…</span>
      <div style="display:flex;gap:8px">
        <button class="log-toggle on" id="log-auto" onclick="logAutoToggle()">自动滚动</button>
        <button class="log-toggle on" id="log-mode" onclick="logModeToggle()">终端视图</button>
      </div>
    </div>
    <div class="log-box" id="log-box" style="display:none"></div>
    <table class="log-list" id="log-list">
      <thead>
        <tr>
          <th>下载时间</th>
          <th>下载格式</th>
          <th>状态</th>
          <th>发布时间</th>
          <th>文件名称</th>
        </tr>
      </thead>
      <tbody id="log-list-body"></tbody>
    </table>
  </section>

  <!-- ═══════ 4. 历史 ═══════ -->
  <section id="p-history">
    <div class="dl-stats" style="grid-template-columns:repeat(2,1fr);margin-bottom:16px">
      <div class="stat-cell">
        <span class="stat-num" id="h-total-all" style="color:#6db88a">0</span>
        <span class="stat-lbl">已完成（累计）</span>
      </div>
      <div class="stat-cell">
        <span class="stat-num" id="h-total-now" style="color:var(--ink)">0</span>

<script src="static/layui/layui.js"></script>
<script>
/* ── 全局 ── */
var _logAuto=true, _hPg=1, _hT=0, _logTmr=null, _logListMode=true;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2200);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/`/g,'&#96;');}
/* 字节格式化（前端版，对应后端 format_byte） */
function formatByte(b){
  if(b==null||b<0)return '0 B';
  var u=['B','KB','MB','GB','TB','PB'];
  var i=0;
  while(b>=1024&&i<u.length-1){b/=1024;i++;}
  return (i===0?Math.round(b):Math.round(b*10)/10)+' '+u[i];
}
/* 日志/历史表格文件名统一显示：发布时间 - 原名（去路径，不重复拼接） */
function logName(f){
  var raw=String(f.name||'');
  var base=raw.lastIndexOf('/')>=0?raw.substring(raw.lastIndexOf('/')+1):raw.lastIndexOf('\\')>=0?raw.substring(raw.lastIndexOf('\\')+1):raw;
  // 若文件名已带日期前缀（YYYY-MM-DD_HH-MM 下划线 或 YYYY-MM-DD HH:MM 空格），不再重复拼接
  if(/^\d{4}-\d{2}-\d{2}[ _]\d{2}[-:]\d{2}\s*-\s*/.test(base))return base;
  if(f.publish_time_str){
    var pt=f.publish_time_str;
    if(base.indexOf(pt)===0)return base;  // 已是新格式
    return pt+' - '+base;
  }
  return base;
}
/* 只显示原名（去掉「发布时间 - 」前缀） */
function logNameOrig(f){
  var raw=String(f.name||'');
  var base=raw.lastIndexOf('/')>=0?raw.substring(raw.lastIndexOf('/')+1):raw.lastIndexOf('\\')>=0?raw.substring(raw.lastIndexOf('\\')+1):raw;
  // 剥离形如 2020-08-01_00-00 - 的前缀
  base=base.replace(/^\d{4}-\d{2}-\d{2}_\d{2}-\d{2}\s*-\s*/, '');
  return base;
}

/* ── 进度条统一渲染 ── */
function pbarHtml(pct){
  var cls=pct>=100?'pbar-green':pct>30?'pbar-violet':'pbar-pink';
  return '<div class="pbar-wrap"><div class="pbar"><div class="pbar-fill '+cls+'" style="width:'+pct+'%"></div></div><span class="pbar-pct">'+pct+'%</span></div>';
}

/* ── 媒体类型图标 ── */
function ftypeIcon(ft){
  var m={'video':'▶','audio':'♪','photo':'▧','document':'▤','voice':'▮','animation':'◈','unknown':'?'};
  return m[ft]||m['unknown'];
}

/* ── 标签页切换 ── */
var _dlTableReady=false;
function showTab(key,btn){
  document.querySelectorAll('.tg-glass > section').forEach(function(s){s.classList.remove('on')});
  document.getElementById('p-'+key).classList.add('on');
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');

  if(key==='history'){hLoad();}
  if(key==='downloads'&&_dlTableReady){
    // layui 表格在隐藏容器里宽度为0，切到可见后必须 resize
    setTimeout(function(){ layui.table.resize('download_list'); layui.table.resize('already_download_list'); },150);
    setTimeout(function(){ layui.table.resize('download_list'); layui.table.resize('already_download_list'); },400);

/* ── 版本 ── */
(function(){var x=new XMLHttpRequest();x.open('GET','get_app_version',false);x.send();document.getElementById('app_version').textContent=x.responseText;})();

/* ── layui 表格初始化（下载标签页） ── */
layui.use(['table','element'],function(){
  var table=layui.table,el=layui.element,$=layui.$;

  table.render({elem:'#download_list',data:[],height:'full-320',limit:10000,
    cols:[[
      {field:'filename',title:'文件',minWidth:200,templet:function(d){
        return '<span class="ftype ftype-'+d.ftype+'">'+ftypeIcon(d.ftype)+'</span><span class="fname">'+esc(d.filename)+'</span>';
      }},
      {field:'total_size',title:'大小',width:80},
      {field:'download_progress',title:'进度',width:120,templet:function(d){
        return pbarHtml(d.download_progress);
      }},
      {field:'download_speed',title:'速度',width:90},
      {field:'status',title:'状态',width:80,templet:function(d){
        var p=d.download_progress;
        if(p>=100)return '<span class="st-badge st-done">已完成</span>';
        if(p>0)return '<span class="st-badge st-run">下载中</span>';
        return '<span class="st-badge st-wait">排队中</span>';
      }}
    ]],done:function(){el.render();}
  });

  table.render({elem:'#already_download_list',data:[],height:240,limit:10000,
    cols:[[
      {field:'id',title:'ID',width:70},
      {field:'filename',title:'文件名'},
      {field:'total_size',title:'大小',width:90},
      {field:'save_path',title:'路径'}
    ]],done:function(){el.render();}
  });

  _dlTableReady=true;

  /* ── 轮询下载列表 ── */
  var _speedCache={}; // {chat+id: {down_byte, time}}
  setInterval(function(){
    $.ajax({url:'get_download_list?already_down=false',type:'get',dataType:'json',
      success:function(res){
        var now=Date.now();
        var activeKeys={};
        res.forEach(function(x){
          var k=x.chat+'-'+x.id; activeKeys[k]=true;
          var prev=_speedCache[k];
          if(prev){
            if(x.down_byte!==undefined && x.down_byte!==prev.down_byte){
              // down_byte 有变化：计算实时速度
              var dt=(now-prev.time)/1000;
              if(dt>0.3){
                var diff=x.down_byte-prev.down_byte;
                prev.speed=diff/dt;  // bytes/s
              }
              prev.down_byte=x.down_byte;
              prev.time=now;
            }
            // down_byte 无变化：保留上次速度，不归零。
            // 慢速下载时 pyrogram 回调间隔可能 >5s，归零会导致速度周期性闪 0。
            // 已完成任务会从 res 消失（progress>=100 被过滤），无需手动归零。
            if(prev.speed!==undefined){
              x.download_speed=formatByte(prev.speed)+'/s';
            }
          }
          if(!prev){
            // 新任务：初始速度取后端已有值，避免首轮闪 0
            var initSpeed=0;
            var m=String(x.download_speed||'').match(/([\d.]+)\s*([KMGTP]?B)\/s/);
            if(m){initSpeed=parseFloat(m[1])*({'B':1,'KB':1024,'MB':1024*1024,'GB':1024*1024*1024}[m[2]]||1);}
            _speedCache[k]={down_byte:x.down_byte, time:now, speed:initSpeed};
          }
        });
        // 清理不再活跃的 cache 条目，防止内存泄漏
        Object.keys(_speedCache).forEach(function(k){if(!activeKeys[k])delete _speedCache[k];});
        // 用 layui table.reload 全量刷新
        var rows=res.filter(function(x){return x.download_progress<100;});
        table.reload('download_list',{data:rows});
        document.getElementById('dl-empty-active').className = rows.length ? 'dl-empty' : 'dl-empty show';
      }});
    $.ajax({url:'get_download_status',type:'get',dataType:'json',
      success:function(r){
        document.getElementById('download_speed_title').textContent=r.download_speed;
      }});
    // 统计概览 + 完成状态
    $.ajax({url:'get_completion_status',type:'get',dataType:'json',
      success:function(r){
        document.getElementById('st-active').textContent=r.active||0;
        document.getElementById('st-finished').textContent=r.finished||0;
        document.getElementById('st-failed').textContent=r.failed||0;
        document.getElementById('st-total').textContent=r.total||0;
        var badge=document.getElementById('dl-done-badge');
        if(r.done&&r.total>0){badge.style.display='inline-flex';badge.textContent='✓ 全部完成 ('+r.total+'条)';}
        else{badge.style.display='none';}
      }});
  },1200);

  setInterval(function(){
    $.ajax({url:'get_download_list?already_down=true',type:'get',dataType:'json',
      success:function(res){
        var d=table.cache['already_download_list']||[];
        var ids={};for(var j=0;j<d.length;j++)ids[d[j].id]=1;
        for(var i=0;i<res.length;i++)if(!ids[res[i].id])d.push(res[i]);
        table.reload('already_download_list',{data:d});
      }});
  },2000);
});

/* ── 从文件系统加载"已下载"列表（带翻页） ── */
var _ddPg=1, _ddTotal=0;
function loadAlreadyFromDisk(){
  var pps=parseInt(document.getElementById('dl-done-pps').value)||10;
  var x=new XMLHttpRequest();
  x.open('GET','get_history?page='+_ddPg+'&per_page='+pps,false);
  x.send();
  if(x.status!==200)return;
  var d=JSON.parse(x.responseText);
  _ddTotal=d.total||0;
  var rows=[];
  (d.files||[]).forEach(function(f){
    rows.push({id:f.name,filename:logName(f),total_size:f.size_str,save_path:f.path});
  });
  layui.table.reload('already_download_list',{data:rows,height: Math.min(rows.length*42+50, 420)});
  document.getElementById('dl-empty-done').className = rows.length ? 'dl-empty' : 'dl-empty show';
  // 翻页信息
  var pages=Math.max(1,Math.ceil(_ddTotal/pps));
  document.getElementById('dl-done-info').textContent=_ddPg+' / '+pages+'  ·  '+_ddTotal+' 条';
  document.getElementById('dl-done-prev').disabled=_ddPg<=1;
  document.getElementById('dl-done-next').disabled=_ddPg>=pages;
}
function dlDoneGo(dir){
  if(dir===-1){
    _ddPg=Math.max(1,_ddPg-1);
  }else if(dir===1){
    var pps=parseInt(document.getElementById('dl-done-pps').value)||10;
    var pages=Math.max(1,Math.ceil(_ddTotal/pps));
    _ddPg=Math.min(pages,_ddPg+1);
  }else{
    _ddPg=dir; // 直接跳页
  }
  loadAlreadyFromDisk();
}

/* ── 暂停/继续 ── */
var _dlBusy=false;
function dlToggle(el){
  if(_dlBusy)return; _dlBusy=true;
  el.style.opacity='0.5'; el.style.pointerEvents='none';
  var x=new XMLHttpRequest();
  x.open('POST','set_download_state?state='+el.dataset.value);
  x.onload=function(){
    var r=x.responseText;
    el.innerHTML=r==='pause'?'暂停':'继续';
    el.dataset.value=r;
    el.style.opacity=''; el.style.pointerEvents='';
    _dlBusy=false;
  };
  x.onerror=function(){
    el.style.opacity=''; el.style.pointerEvents='';
    _dlBusy=false;
    toast('操作失败，请重试');
  };
  x.send();
}

/* ── 配置 ── */
function loadCfg(){
  try{
  var x=new XMLHttpRequest();x.open('GET','get_config',false);x.send();
  if(x.status!==200){toast('配置加载失败: HTTP '+x.status);return;}
  var c=JSON.parse(x.responseText);
  document.getElementById('c-apid').value=c.api_id||'';
  document.getElementById('c-apih').value=c.api_hash_set?c.api_hash:'';
  document.getElementById('c-apih').placeholder=c.api_hash_set?'已设置（修改时填入新值）':'未设置';
  document.getElementById('c-bot').value=c.bot_token||'';
  document.querySelectorAll('#c-media input[type="checkbox"]').forEach(function(cb){
    cb.checked=(c.media_types||[]).indexOf(cb.value)>=0;
  });
  document.getElementById('c-fa').value=(c.file_formats||{}).audio||'all';
  document.getElementById('c-fv').value=(c.file_formats||{}).video||'all';
  document.getElementById('c-fd').value=(c.file_formats||{}).document||'all';
  document.getElementById('c-fp').value=(c.file_formats||{}).photo||'all';
  document.getElementById('c-mt').value=c.max_download_task||5;
  document.getElementById('c-lang').value=c.language||'EN';
  document.getElementById('c-df').value=c.date_format||'%Y_%m';
  document.getElementById('c-ws').value='';
  document.getElementById('c-ws').placeholder=c.web_login_secret_set?'已设置（留空不修改）':'未设置';
  document.getElementById('c-wle').checked=!!c.web_login_enabled;
  var cl=document.getElementById('c-chats');cl.innerHTML='';
  (c.chat||[]).forEach(function(ch){addChat(ch);});
  }catch(e){toast('配置加载失败: '+e.message);}
}
function addChat(ch){
  ch=ch||{};
  var d=document.createElement('div');d.className='cc';
  var cid=esc(ch.chat_id||'');
  var clr=esc(ch.last_read_message_id||0);
  var nte=esc(ch.note||'');
  d.innerHTML='<input class="cid" placeholder="chat_id（me / @channel / -100xxx）" value="'+cid+'">'
    +'<input class="clr" type="number" placeholder="last_read_msg_id" value="'+clr+'" style="max-width:160px">'
    +'<input class="cnote" type="text" placeholder="备注（可选）" value="'+nte+'" style="flex:1;min-width:120px">'
    +'<button class="mv" onclick="moveChat(this,1)" title="上移">↑</button>'
    +'<button class="mv" onclick="moveChat(this,-1)" title="下移">↓</button>'
    +'<button class="x" onclick="this.parentNode.remove()">×</button>';
  document.getElementById('c-chats').appendChild(d);
}
function moveChat(btn,dir){
  var el=btn.parentNode;
  if(dir>0){ // 上移：插到前一个兄弟之前
    var prev=el.previousElementSibling;
    if(prev) el.parentNode.insertBefore(el,prev);
  }else{ // 下移：插到后一个兄弟之后
    var next=el.nextElementSibling;
    if(next) el.parentNode.insertBefore(next,el);
  }
}
function saveCfg(restart){
  try{
  var ah=document.getElementById('c-apih').value;
  if(ah && ah.length<=4){toast('api_hash 长度不足，未修改');ah='';}
  var media=[];
  document.querySelectorAll('#c-media input:checked').forEach(function(cb){media.push(cb.value);});
  var chats=[];
  document.querySelectorAll('#c-chats .cc').forEach(function(el){
    var id=el.querySelector('.cid').value.trim();
    if(id)chats.push({
      chat_id:/^\d+$/.test(id)?parseInt(id):id,
      last_read_message_id:parseInt(el.querySelector('.clr').value)||0,
      note:el.querySelector('.cnote')?el.querySelector('.cnote').value.trim():''
    });
  });
  var p={
    api_id:parseInt(document.getElementById('c-apid').value)||null,
    api_hash:ah,
    bot_token:document.getElementById('c-bot').value,
    media_types:media,
    file_formats:{
      audio:document.getElementById('c-fa').value,
      video:document.getElementById('c-fv').value,
      document:document.getElementById('c-fd').value,
      photo:document.getElementById('c-fp').value
    },
    max_download_task:parseInt(document.getElementById('c-mt').value)||5,
    language:document.getElementById('c-lang').value,
    date_format:document.getElementById('c-df').value,
    web_login_secret:document.getElementById('c-ws').value,
    web_login_enabled:document.getElementById('c-wle').checked,
    chat:chats,
    restart_program: !!restart
  };
  var x=new XMLHttpRequest();x.open('POST','save_config',false);
  x.setRequestHeader('Content-Type','application/json');
  x.send(JSON.stringify(p));
  var r=JSON.parse(x.responseText);
  if(restart){
    toast('配置已保存，容器即将重启…');
    setTimeout(function(){location.reload();},5000);
  }else{
    toast(r.msg||'已保存，重启容器后生效');
  }
  }catch(e){toast('保存失败: '+e.message);}
}
loadCfg();

/* ── 日志 ── */
function startLog(){if(_logTmr)return;_logTmr=setInterval(pollLog,2000);pollLog();}
function stopLog(){if(_logTmr){clearInterval(_logTmr);_logTmr=null;}}
function pollLog(){
  var x=new XMLHttpRequest();
  x.open('GET','get_logs?lines=200',true);
  x.onreadystatechange=function(){
    if(x.readyState!==4)return;
    if(x.status===200){
      try{
        var lines=JSON.parse(x.responseText);
        document.getElementById('log-box').textContent=lines.join('\n');
        document.getElementById('log-n').textContent=lines.length+' 行';
        if(_logAuto){var b=document.getElementById('log-box');b.scrollTop=b.scrollHeight;}
        if(_logListMode)renderLogTable();
      }catch(e){}
    }
  };
  x.send();
}
function renderLogTable(){
  // 列表视图：从下载历史库取结构化数据，渲染 5 列表格（最近 50 条）
  var x=new XMLHttpRequest();x.open('GET','get_history?page=1&per_page=50&media_type=All',true);
  x.onreadystatechange=function(){
    if(x.readyState!==4||x.status!==200)return;
    try{
      var d=JSON.parse(x.responseText);
      var tb=document.getElementById('log-list-body');
      if(!d.files||!d.files.length){tb.innerHTML='<tr><td colspan="5" class="empty">暂无记录</td></tr>';return;}
      var html='';
      d.files.forEach(function(f){
        var ext=(f.name.split('.').pop()||'').toUpperCase();
        var st=f.status==='failed'?'<span class="st-fail">失败</span>':f.status==='skip'?'<span class="st-skip">跳过</span>':'<span class="st-ok">成功</span>';
        var up=f.publish_time_str||'-';
        html+='<tr>'
          +'<td>'+esc(f.mtime_str)+'</td>'
          +'<td>'+esc(ext)+'</td>'
          +'<td>'+st+'</td>'
          +'<td>'+esc(up)+'</td>'
          +'<td class="log-fname">'+esc(logName(f))+'</td>'
          +'</tr>';
      });
      tb.innerHTML=html;
    }catch(e){}
  };
  x.send();
}
function logAutoToggle(){
  _logAuto=!_logAuto;
  document.getElementById('log-auto').className='log-toggle'+(_logAuto?' on':'');
  document.getElementById('log-auto').textContent=_logAuto?'自动滚动':'已暂停';
}
function logModeToggle(){
  _logListMode=!_logListMode;
  var btn=document.getElementById('log-mode');
  btn.className='log-toggle'+(_logListMode?' on':'');
  btn.textContent=_logListMode?'终端视图':'列表视图';
  document.getElementById('log-box').style.display=_logListMode?'none':'block';
  document.getElementById('log-list').style.display=_logListMode?'table':'none';
  if(_logListMode){renderLogTable();}
}

/* ── 历史 ── */
function hLoad(){
  var q=encodeURIComponent(document.getElementById('h-q').value||'');
  var t=document.getElementById('h-type').value;
  var pps=parseInt(document.getElementById('h-pps').value)||20;
  var x=new XMLHttpRequest();x.open('GET','get_history?page='+_hPg+'&per_page='+pps+'&search='+q+'&media_type='+t,false);x.send();
  var d=JSON.parse(x.responseText);
  _hT=d.total;
  var pg=Math.max(1,Math.ceil(d.total/pps));
  document.getElementById('h-info').textContent=_hPg+' / '+pg+'  ·  '+d.total+' 条';
  document.getElementById('h-prev').disabled=_hPg<=1;
  document.getElementById('h-next').disabled=_hPg>=pg;
  // 累计总数（全量）与当前筛选数
  if(d.total_all!==undefined){document.getElementById('h-total-all').textContent=d.total_all||0;}
  document.getElementById('h-total-now').textContent=d.total||0;
  var tb=document.getElementById('h-body');tb.innerHTML='';
  if(!d.files || !d.files.length){tb.innerHTML='<tr><td colspan="5" class="empty">暂无文件</td></tr>';return;}
  var html='';
  d.files.forEach(function(f){
    var ext=(f.name.split('.').pop()||'').toUpperCase();
    var st=f.status==='failed'?'<span class="st-fail">失败</span>':f.status==='skip'?'<span class="st-skip">跳过</span>':'<span class="st-ok">成功</span>';
    var up=f.publish_time_str||'-';
    html+='<tr><td>'+esc(f.mtime_str)+'</td><td>'+esc(ext)+'</td><td>'+st+'</td><td>'+esc(up)+'</td><td class="log-fname">'+esc(logName(f))+'</td></tr>';
  });
  tb.innerHTML=html;
}
function hPage(d){
    var pps=parseInt(document.getElementById('h-pps').value)||20;
    if(d===-1)_hPg=Math.max(1,_hPg-1);
    else if(d===1)_hPg=Math.min(Math.max(1,Math.ceil(_hT/pps)),_hPg+1);
    hLoad();
  }
  function hPgReset(){_hPg=1;hLoad();}
function hJump(){
  var pps=parseInt(document.getElementById('h-pps').value)||20;
  var pg=Math.max(1,Math.ceil(_hT/pps));
  var v=parseInt(document.getElementById('h-goto').value)||1;
  if(v<1)v=1;if(v>pg)v=pg;
  _hPg=v;hLoad();
}
function hClear(){
  if(!confirm('确定清空所有下载历史？'))return;
  var x=new XMLHttpRequest();x.open('POST','clear_history',false);x.send();
  hLoad();toast('历史已清空');
}
</script>
